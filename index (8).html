<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dashboard de Posts · Kits de Fim de Ano · GV Logística</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#f5f6f8;--card:#fff;--tx:#1b2430;--mut:#667085;--bd:#e3e6eb;--ac:#1f3a5f;--ok:#1c8a5a;--warn:#c2410c;--chip:#eef1f5}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12161c;--card:#1b222b;--tx:#e8ecf1;--mut:#9aa6b5;--bd:#2a333f;--ac:#7fb0e8;--ok:#4cc38a;--warn:#fb923c;--chip:#242d38}}
:root[data-theme="dark"]{--bg:#12161c;--card:#1b222b;--tx:#e8ecf1;--mut:#9aa6b5;--bd:#2a333f;--ac:#7fb0e8;--ok:#4cc38a;--warn:#fb923c;--chip:#242d38}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 -apple-system,"Segoe UI",Roboto,Arial,sans-serif}
main{max-width:980px;margin:0 auto;padding:20px 16px 48px}
h1{font-size:22px;margin:0 0 2px}.sub{color:var(--mut);margin:0 0 16px;font-size:13px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:14px}
.kpi{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px 14px}
.kpi b{display:block;font-size:24px}.kpi span{color:var(--mut);font-size:12px}
.bar{height:10px;background:var(--chip);border-radius:6px;overflow:hidden;margin-bottom:16px}
.bar i{display:block;height:100%;width:0;background:var(--ok);transition:width .25s}
.filters{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px;align-items:center}
.chip,select{background:var(--chip);color:var(--tx);border:1px solid var(--bd);border-radius:999px;padding:6px 12px;font-size:13px;cursor:pointer}
.chip.on{background:var(--ac);color:var(--bg);border-color:var(--ac)}
select{border-radius:8px}
.wk{background:var(--card);border:1px solid var(--bd);border-radius:12px;margin-bottom:14px;overflow:hidden}
.wh{display:flex;justify-content:space-between;gap:8px;padding:10px 14px;background:var(--chip);font-weight:600;font-size:14px;flex-wrap:wrap}
.wh small{color:var(--mut);font-weight:400}
.row{display:grid;grid-template-columns:28px 78px 1fr;gap:10px;padding:10px 14px;border-top:1px solid var(--bd);align-items:start}
.row.done{opacity:.55}.row.done .th{text-decoration:line-through}
.row input{width:20px;height:20px;margin-top:2px;accent-color:var(--ok);cursor:pointer}
.dt{font-weight:600}.dt small{display:block;color:var(--mut);font-weight:400}
.th{font-weight:600}
.meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px;font-size:12px}
.tag{background:var(--chip);border-radius:6px;padding:2px 8px;color:var(--mut)}
.tag.b{background:#fff4e5;color:#b45309}@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .tag.b{background:#3a2a14;color:#fbbf6a}}
.tag.l{color:var(--warn);font-weight:600}
.empty{padding:16px;color:var(--mut);text-align:center}
button.r{background:none;border:0;color:var(--mut);font-size:12px;text-decoration:underline;cursor:pointer;margin-top:8px}
@media (max-width:520px){.row{grid-template-columns:28px 1fr}.dt{grid-column:2}.th-box{grid-column:2}}
</style>
</head>
<body>
<main>
<h1>📦 Posts · Kits de Fim de Ano 2026</h1>
<p class="sub">GV Logística · 12/10 a 06/12 · marque cada post ao publicar</p>
<div class="kpis">
<div class="kpi"><b id="k1">0</b><span>posts feitos</span></div>
<div class="kpi"><b id="k2">48</b><span>restantes</span></div>
<div class="kpi"><b id="k3">0%</b><span>da campanha</span></div>
<div class="kpi"><b id="k4" style="font-size:16px">—</b><span>próximo post</span></div>
</div>
<div class="bar"><i id="pb"></i></div>
<div class="filters">
<span class="chip on" data-s="all">Todos</span><span class="chip" data-s="pend">Pendentes</span><span class="chip" data-s="done">Feitos</span><span class="chip" data-s="boost">⚡ Impulsionar</span>
<select id="fm"><option value="">Formato</option><option>Reels</option><option>Carrossel</option><option>Estático</option></select>
<select id="pl"><option value="">Pilar</option><option>Educação</option><option>Autoridade</option><option>Bastidores</option><option>Venda</option><option>Entretenimento</option><option>Engajamento</option></select>
</div>
<div id="list"></div>
<button class="r" id="reset">Limpar todas as marcações</button>
</main>
<script>
const WK=["O relógio de fim de ano","Kit certo, do jeito certo","Erros que viram retrabalho","Quem faz o kit acontecer","Prazo e planejamento","Aprovou? Então vai","Black Friday não atrasa kit","Reta final"];
// [semana, data, dia, formato, pilar, tema, CTA]
const P=[
[1,"12/10","Seg","Estático","Entretenimento","Feriado: “Hoje é o último dia de paz antes de dezembro.”","Salvar"],
[1,"13/10","Ter","Reels","Educação","Contagem regressiva do kit","Compartilhar"],
[1,"14/10","Qua","Carrossel","Educação","Cronograma reverso: do briefing à entrega em 8 passos","Salvar"],
[1,"15/10","Qui","Reels","Bastidores","Galpão em outubro: recebendo os primeiros insumos","Seguir"],
[1,"16/10","Sex","Carrossel","Educação","5 perguntas antes de contratar quem monta seu kit","Comentar"],
[1,"17/10","Sáb","Estático","Engajamento","Enquete: o item que nunca pode faltar num kit","Votar"],
[2,"19/10","Seg","Carrossel","Educação","Tipos de kit e o que muda na montagem","Salvar"],
[2,"20/10","Ter","Reels","Entretenimento","Esquete: o briefing que chega “pra ontem”","Marcar o colega"],
[2,"21/10","Qua","Carrossel","Educação","4 fatores que definem o prazo de montagem","Compartilhar"],
[2,"22/10","Qui","Reels","Autoridade","Da lista de itens ao pallet: estoque com WMS","Seguir"],
[2,"23/10","Sex","Estático","Venda","Agenda de montagem de fim de ano aberta","Link na bio / DM"],
[2,"24/10","Sáb","Estático","Engajamento","Caixa de perguntas: maior dúvida sobre kit","Responder"],
[3,"26/10","Seg","Carrossel","Educação","7 erros de kit de fim de ano que viram retrabalho","Salvar"],
[3,"27/10","Ter","Reels","Autoridade","Conferência item a item","Seguir"],
[3,"28/10","Qua","Carrossel","Educação","Embalagem: o que proteger e o que mostrar","Compartilhar"],
[3,"29/10","Qui","Reels","Entretenimento","Os tipos de cliente em dezembro","Marcar"],
[3,"30/10","Sex","Carrossel","Autoridade","Anatomia de um projeto [case autorizado]","Salvar"],
[3,"31/10","Sáb","Estático","Entretenimento","“Assustador mesmo é descobrir que faltam 300 kits.”","Compartilhar"],
[4,"02/11","Seg","Estático","Engajamento","Feriado: enquete “Quando seu cliente fecha o kit?”","Votar"],
[4,"03/11","Ter","Carrossel","Autoridade","Equipe contada por objetos (sem rostos)","Seguir"],
[4,"04/11","Qua","Reels","Bastidores","Um dia na linha de montagem","Compartilhar"],
[4,"05/11","Qui","Carrossel","Educação","Checklist de briefing: o que a logística precisa saber","Salvar"],
[4,"06/11","Sex","Estático","Venda","Isca: baixe o Checklist de Briefing de Kit","Comentar “KIT”"],
[4,"07/11","Sáb","Reels","Entretenimento","Trend adaptada ao universo de galpão","Compartilhar"],
[5,"09/11","Seg","Carrossel","Educação","Os custos que não aparecem no orçamento","Salvar"],
[5,"10/11","Ter","Reels","Educação","3 coisas que atrasam kit: aprovação, insumo, endereço","Compartilhar"],
[5,"11/11","Qua","Carrossel","Autoridade","Armazenagem + montagem + expedição num fluxo só","Seguir"],
[5,"12/11","Qui","Reels","Bastidores","Kit piloto: o teste antes de rodar o lote","Salvar"],
[5,"13/11","Sex","Estático","Venda","Janelas de montagem de dezembro [X vagas]","DM / link"],
[5,"14/11","Sáb","Estático","Engajamento","Caixa: maior perrengue de kit que você já viveu","Responder"],
[6,"16/11","Seg","Carrossel","Educação","Por que aprovar um kit piloto antes de produzir","Salvar"],
[6,"17/11","Ter","Reels","Venda","Prazo final para aprovar orçamento [DATA-LIMITE]","DM / link"],
[6,"18/11","Qua","Carrossel","Autoridade","O que clientes dizem [depoimentos autorizados]","Seguir"],
[6,"19/11","Qui","Reels","Bastidores","Insumos conferidos e separados","Compartilhar"],
[6,"20/11","Sex","Estático","Entretenimento","Feriado: “Descansar também é planejamento.”","Salvar"],
[6,"21/11","Sáb","Estático","Engajamento","Enquete: kit físico ou digital em 2027?","Votar"],
[7,"23/11","Seg","Carrossel","Educação","Planejar kit com a logística apertada de dezembro","Salvar"],
[7,"24/11","Ter","Reels","Autoridade","Depois da montagem: transporte, SLA e rastreio","Seguir"],
[7,"25/11","Qua","Estático","Venda","Últimas janelas de montagem antes do Natal","DM / link"],
[7,"26/11","Qui","Carrossel","Educação","Plano B: e se um item atrasar?","Compartilhar"],
[7,"27/11","Sex","Reels","Entretenimento","“Todo mundo quer desconto. Kit quer prazo.”","Marcar"],
[7,"28/11","Sáb","Estático","Engajamento","Caixa de perguntas final","Responder"],
[8,"30/11","Seg","Carrossel","Educação","Últimos 10 dias: o que ainda dá para fazer","Salvar"],
[8,"01/12","Ter","Reels","Venda","Última chamada: pequeno e médio volume","DM / link"],
[8,"02/12","Qua","Reels","Bastidores","Kits saindo na expedição","Compartilhar"],
[8,"03/12","Qui","Carrossel","Autoridade","O que aprendemos montando kits neste fim de ano","Seguir"],
[8,"04/12","Sex","Estático","Engajamento","Agradecimento a clientes e parceiros","Comentar"],
[8,"05/12","Sáb","Estático","Venda","Semente 2027: já pensou nos kits do ano que vem?","DM"]
];
const BOOST={"13/10":"A","14/10":"A","27/10":"A","04/11":"A","10/11":"A","23/10":"B","13/11":"B","17/11":"B","25/11":"B","01/12":"B","05/11":"C","06/11":"C","30/10":"D","09/11":"D","16/11":"D","18/11":"D","26/11":"D"};
const KEY="gvlog-kits-2026-done";
let done=new Set();
try{done=new Set(JSON.parse(localStorage.getItem(KEY)||"[]"))}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify([...done]))}catch(e){}}
let st="all";
const $=id=>document.getElementById(id);
const toDate=d=>{const[a,b]=d.split("/");return new Date(2026,+b-1,+a,23,59)};
function render(){
 const fm=$("fm").value,pl=$("pl").value,now=new Date();
 let h="";
 WK.forEach((name,i)=>{
  const all=P.filter(p=>p[0]===i+1);
  const nd=all.filter(p=>done.has(p[1])).length;
  const rows=all.filter(p=>
   (st==="all"||(st==="pend"&&!done.has(p[1]))||(st==="done"&&done.has(p[1]))||(st==="boost"&&BOOST[p[1]]))&&
   (!fm||p[3]===fm)&&(!pl||p[4]===pl));
  if(!rows.length)return;
  h+=`<section class="wk"><div class="wh"><span>Semana ${i+1} · ${name}</span><small>${all[0][1]} a ${all[all.length-1][1]} · ${nd}/${all.length} feitos</small></div>`;
  rows.forEach(p=>{
   const d=done.has(p[1]),late=!d&&toDate(p[1])<now;
   h+=`<div class="row${d?" done":""}"><input type="checkbox" data-d="${p[1]}" ${d?"checked":""} aria-label="Marcar ${p[1]} como feito"><div class="dt">${p[1]}<small>${p[2]}</small></div><div class="th-box"><div class="th">${p[5]}</div><div class="meta"><span class="tag">${p[3]}</span><span class="tag">${p[4]}</span><span class="tag">CTA: ${p[6]}</span>${BOOST[p[1]]?`<span class="tag b">⚡ Impulsionar · Camp. ${BOOST[p[1]]}</span>`:""}${late?`<span class="tag l">Atrasado</span>`:""}</div></div></div>`;
  });
  h+="</section>";
 });
 $("list").innerHTML=h||'<div class="empty">Nenhum post com esses filtros.</div>';
 const n=done.size;
 $("k1").textContent=n;$("k2").textContent=P.length-n;
 $("k3").textContent=Math.round(n/P.length*100)+"%";
 $("pb").style.width=(n/P.length*100)+"%";
 const nx=P.find(p=>!done.has(p[1]));
 $("k4").textContent=nx?`${nx[1]} · ${nx[3]}`:"Tudo feito 🎉";
}
$("list").addEventListener("change",e=>{
 const d=e.target.dataset.d;if(!d)return;
 e.target.checked?done.add(d):done.delete(d);save();render();
});
document.querySelectorAll(".chip").forEach(c=>c.onclick=()=>{
 document.querySelectorAll(".chip").forEach(x=>x.classList.remove("on"));
 c.classList.add("on");st=c.dataset.s;render();
});
$("fm").onchange=$("pl").onchange=render;
$("reset").onclick=()=>{if(confirm("Limpar todas as marcações?")){done=new Set();save();render()}};
render();
</script>
</body>
</html>
